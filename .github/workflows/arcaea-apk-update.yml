name: Arcaea APK update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Updater mode"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - check-only

permissions:
  contents: write

concurrency:
  group: arcaea-apk-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ROS_ACCESS_KEY: ${{ secrets.ROS_ACCESS_KEY }}
      ROS_SECRET_KEY: ${{ secrets.ROS_SECRET_KEY }}
      ROS_ENDPOINT: ${{ secrets.ROS_ENDPOINT }}
      ROS_BUCKET: ${{ secrets.ROS_BUCKET }}
      ROS_PUBLIC_BASE_URL: ${{ secrets.ROS_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/arcaea-apk-updater/package-lock.json

      - name: Install Arcaea updater dependencies
        run: npm --prefix tools/arcaea-apk-updater ci --no-audit --no-fund

      - name: Run Arcaea APK updater
        run: npm --prefix tools/arcaea-apk-updater run check -- --mode "${{ inputs.mode || 'publish' }}"
