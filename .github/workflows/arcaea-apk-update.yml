name: Arcaea APK update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Updater mode"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - check-only

permissions:
  contents: write

concurrency:
  group: arcaea-apk-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/arcaea-apk-updater/package-lock.json

      - name: Install Arcaea updater dependencies
        run: npm --prefix tools/arcaea-apk-updater ci --no-audit --no-fund

      - name: Expose updater dependencies to shared domain source
        run: ln -s tools/arcaea-apk-updater/node_modules node_modules

      - name: Run Arcaea APK updater
        run: npm --prefix tools/arcaea-apk-updater run check -- --mode "${{ inputs.mode || 'publish' }}" --staging-dir "$RUNNER_TEMP/arcaea-update"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROS_REFERER: https://rhythmarchive.github.io/
          ROS_ACCESS_KEY: ${{ secrets.ROS_ACCESS_KEY }}
          ROS_SECRET_KEY: ${{ secrets.ROS_SECRET_KEY }}
          ROS_ENDPOINT: ${{ secrets.ROS_ENDPOINT }}
          ROS_BUCKET: ${{ secrets.ROS_BUCKET }}
          ROS_PUBLIC_BASE_URL: ${{ secrets.ROS_PUBLIC_BASE_URL }}
          # Explicit opt-in; absent configuration keeps GitHub-only publishing.
          ARCAEA_R2_ENABLED: ${{ vars.ARCAEA_R2_ENABLED || 'false' }}
          ARCAEA_R2_ENDPOINT: ${{ vars.ARCAEA_R2_ENDPOINT }}
          ARCAEA_R2_BUCKET: ${{ vars.ARCAEA_R2_BUCKET }}
          ARCAEA_R2_PUBLIC_BASE_URL: ${{ vars.PUBLIC_ARCAEA_R2_BASE_URL }}
          ARCAEA_R2_ACCESS_KEY_ID: ${{ secrets.ARCAEA_R2_ACCESS_KEY_ID }}
          ARCAEA_R2_SECRET_ACCESS_KEY: ${{ secrets.ARCAEA_R2_SECRET_ACCESS_KEY }}
