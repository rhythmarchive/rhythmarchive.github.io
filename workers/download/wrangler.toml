name = "rhythm-archive-download"
main = "gateway.mjs"
compatibility_date = "2026-09-06"
workers_dev = false
preview_urls = false
routes = [{ pattern = "dl.rhythmarchive.top", custom_domain = true }]

[[r2_buckets]]
binding = "FILES"
bucket_name = "rhythm-archive"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1334342181"
[ratelimits.simple]
limit = 180
period = 60
