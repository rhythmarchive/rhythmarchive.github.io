name = "rhythm-archive-stats"
main = "src/index.ts"
compatibility_date = "2026-09-06"
workers_dev = true

[[routes]]
pattern = "api.rhythmarchive.top"
custom_domain = true

[vars]
ALLOWED_ORIGINS = "https://rhythmarchive.github.io,http://localhost:4321,http://127.0.0.1:4321"
SITE_TIME_ZONE = "Asia/Shanghai"
TURNSTILE_REQUIRED = "true"
TURNSTILE_EXPECTED_HOSTNAME = "rhythmarchive.github.io"
TURNSTILE_EXPECTED_ACTION = "update-reminder"
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1334342177"
[ratelimits.simple]
limit = 120
period = 60

[[d1_databases]]
binding = "DB"
database_name = "rhythm-archive-stats"
database_id = "2baa6844-3fee-4baf-ac11-885079a7813e"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]
