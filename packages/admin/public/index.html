<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Asset Desk</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <div id="app-shell">
      <aside class="rail" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark">A</span>
          <div>
            <strong>Asset Desk</strong>
            <span>本地资源工作台</span>
          </div>
        </div>
        <nav class="nav-list">
          <button class="nav-item" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
          <button class="nav-item" data-page="new"><span class="nav-icon">＋</span>新建更新</button>
          <button class="nav-item" data-page="review"><span class="nav-icon">✓</span>更新审核</button>
          <button class="nav-item" data-page="upscale"><span class="nav-icon">↗</span>AI 超分</button>
          <button class="nav-item" data-page="publish"><span class="nav-icon">≡</span>发布</button>
          <button class="nav-item" data-page="legacy"><span class="nav-icon">↻</span>首次迁移</button>
        </nav>
        <div class="rail-footer">
          <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>设置</button>
          <button class="theme-toggle" data-action="toggle-theme" type="button">深色模式</button>
        </div>
      </aside>
      <section class="app-main">
        <header class="topbar">
          <div class="crumbs" id="page-crumb">Dashboard</div>
          <div class="topbar-actions">
            <label class="workspace-picker">
              <span>当前工作区</span>
              <select id="workspace-select" aria-label="当前工作区">
                <option value="">未选择</option>
              </select>
            </label>
            <button class="button button-primary button-small" data-page="new" type="button">新建更新</button>
          </div>
        </header>
        <main id="page" tabindex="-1"></main>
      </section>
    </div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script src="/admin.js" defer></script>
  </body>
</html>
